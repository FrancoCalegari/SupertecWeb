<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - SupertecWeb</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <style>
        *{ box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e0f10;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            position: relative;
            overflow: hidden;
        }
        
        /* Fondo con imagen y overlay igual que el home */
        .bg-image {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('assets/img/fondos/fondo1.jpg') no-repeat center center/cover;
            z-index: -2;
        }
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        .login-container {
            width: 350px;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
            text-align: center;
        }
        .login-container h2 {
            margin-bottom: 25px;
            color: #fff;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .login-container input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 14px;
            color: #fff;
            transition: all 0.3s ease;
        }
        .login-container input::placeholder {
            color: #aaa;
        }
        .login-container input:focus {
            border-color: #fb383a;
            box-shadow: 0 0 10px rgba(251, 56, 58, 0.3);
            outline: none;
            background: rgba(255, 255, 255, 0.15);
        }
        .login-container button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #fb383a;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(251, 56, 58, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .login-container button:hover:not(:disabled) {
            background: #e02e30;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 56, 58, 0.6);
        }
        .login-container button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .btn-spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: none;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .login-container .error {
            color: #ff6b6b;
            margin-top: 15px;
            font-size: 0.9rem;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="bg-image"></div>
    <div class="bg-overlay"></div>
    <div class="login-container">
        <div style="margin-bottom: 1rem;">
            <img src="assets/img/logo.png" alt="Supertec Logo" style="height: 60px;">
        </div>
        <h2>Iniciar Sesión</h2>
        <form id="loginForm" action="/login" method="POST">
            <input type="text" name="username" placeholder="Usuario" autocomplete="username" required>
            <input type="password" name="password" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit" id="loginBtn">
                <span class="btn-spinner" id="btnSpinner"></span>
                <span id="btnText">Entrar</span>
            </button>
            <div class="error" id="errorMsg" role="alert"></div>
        </form>
        <script>
            // Show error without document.write
            if (new URLSearchParams(window.location.search).get("error") === "1") {
                document.getElementById("errorMsg").textContent = "Usuario o contraseña incorrectos.";
            }
            // Loading state on submit
            document.getElementById("loginForm").addEventListener("submit", function() {
                const btn = document.getElementById("loginBtn");
                const spinner = document.getElementById("btnSpinner");
                const text = document.getElementById("btnText");
                btn.disabled = true;
                spinner.style.display = "block";
                text.textContent = "Verificando...";
            });
        </script>
    </div>
</body>
</html>
